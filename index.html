<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .status {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .loading {
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 25px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Camera Capture</h1>
        
        <input type="text" id="serverUrl" placeholder="Enter Server IP:Port (e.g., 192.168.1.100:9999)">
        
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
        </div>
        
        <button id="capture">📷 CAPTURE PHOTO</button>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Sending photo...</p>
        </div>
        <div id="status" class="status"></div>
        <div class="info">
            <p>⚠️ Allow camera permission when prompted</p>
            <p>📡 Enter your Admin app's IP address above</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        const serverUrlInput = document.getElementById('serverUrl');
        
        let stream = null;
        
        // Load saved server URL
        const savedUrl = localStorage.getItem('serverUrl');
        if (savedUrl) {
            serverUrlInput.value = savedUrl;
        }
        
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                statusDiv.className = 'status';
                statusDiv.style.display = 'none';
            } catch (err) {
                showStatus('Camera access denied. Please allow camera permission.', 'error');
                captureBtn.disabled = true;
            }
        }
        
        function showStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.className = `status ${type}`;
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }
        
        async function capturePhoto() {
            if (!stream) {
                showStatus('Camera not ready', 'error');
                return;
            }
            
            let serverUrl = serverUrlInput.value.trim();
            if (!serverUrl) {
                showStatus('Please enter server IP address', 'error');
                return;
            }
            
            // Save for next time
            localStorage.setItem('serverUrl', serverUrl);
            
            // Ensure URL has http://
            if (!serverUrl.startsWith('http')) {
                serverUrl = 'http://' + serverUrl;
            }
            
            loadingDiv.style.display = 'flex';
            captureBtn.disabled = true;
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob, 'photo.jpg');
                formData.append('device', navigator.userAgent);
                
                try {
                    const response = await fetch(serverUrl + '/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        showStatus('✅ Photo captured and sent successfully!', 'success');
                    } else {
                        showStatus('❌ Failed to send photo. Server IP correct?', 'error');
                    }
                } catch (err) {
                    showStatus('❌ Network error: ' + err.message, 'error');
                } finally {
                    loadingDiv.style.display = 'none';
                    captureBtn.disabled = false;
                }
            }, 'image/jpeg', 0.9);
        }
        
        captureBtn.addEventListener('click', capturePhoto);
        initCamera();
    </script>
</body>
</html>
